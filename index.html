<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Quest – Tempel der vergessenen Kristalle</title>
<style>
:root{--bg:#10131b;--panel:#1b2230;--gold:#f3c969;--text:#f4f0e6;--muted:#a9b2c2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#293246,#10131b 65%);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:min(100%,900px)}
header{text-align:center;margin-bottom:16px}
h1{margin:0;color:var(--gold);letter-spacing:3px;font-size:clamp(1.7rem,5vw,2.7rem);text-shadow:0 3px #694c1e}
header p{margin:6px 0;color:var(--muted)}
.frame{background:#171d28;border:2px solid #566174;border-radius:16px;padding:14px;box-shadow:0 18px 55px #0009}
.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.stat{background:#252e3d;border:1px solid #3b4659;border-radius:9px;padding:8px 12px;font-weight:700}
.stat span{color:var(--gold)}
#game{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#080b11;border:3px solid #3c4656;border-radius:8px;image-rendering:pixelated;touch-action:none}
.below{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:9px;padding:10px 15px;background:var(--gold);color:#241a08;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.08)}
#message{color:var(--muted);font-size:.95rem;min-height:24px}
.help{text-align:center;color:var(--muted);font-size:.88rem;margin:13px 0 0}
.touch{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center;margin-top:12px}
.touch button{padding:0;font-size:1.2rem;background:#344052;color:white;border:1px solid #66758b}
.touch button:nth-child(1){grid-column:2;grid-row:1}
.touch button:nth-child(2){grid-column:1;grid-row:2}
.touch button:nth-child(3){grid-column:2;grid-row:2}
.touch button:nth-child(4){grid-column:3;grid-row:2}
@media(max-width:650px){body{padding:8px}.frame{padding:8px}.touch{display:grid}.help{font-size:.8rem}}
</style>
</head>
<body>
<main>
<header>
<h1>CRYSTAL QUEST</h1>
<p>Tempel der vergessenen Kristalle</p>
</header>
<section class="frame">
<div class="hud">
<div class="stat">💎 Kristalle: <span id="gems">0 / 0</span></div>
<div class="stat">❤️ Leben: <span id="lives">3</span></div>
<div class="stat">🔑 Schlüssel: <span id="keys">0</span></div>
<div class="stat">⭐ Punkte: <span id="score">0</span></div>
</div>
<canvas id="game" width="640" height="448" aria-label="Crystal Quest Spielfeld"></canvas>
<div class="below">
<div id="message">Sammle alle Kristalle und finde den Ausgang.</div>
<div><button id="restart">↻ Neu starten</button></div>
</div>
<div class="touch" aria-label="Touch-Steuerung">
<button data-dir="up">▲</button><button data-dir="left">◀</button>
<button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>
<p class="help">Steuerung: Pfeiltasten oder WASD · R = Neustart · Sammle alle Kristalle, dann betrete den Ausgang.</p>
</section>
</main>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const TILE=32,COLS=20,ROWS=14;
const ui={gems:document.getElementById("gems"),lives:document.getElementById("lives"),keys:document.getElementById("keys"),score:document.getElementById("score"),message:document.getElementById("message")};

// # Wand, . Boden, D Erde, G Kristall, O Fels, K Schlüssel, E Ausgang,
// M Wächter, T Stachel-Falle, L verschlossene Tür
const LEVEL=[
"####################",
"#....D....#........#",
"#.##.O...##.###....#",
"#..G..D.....#...G..#",
"#.####.####.#.##...#",
"#....#....O.#......#",
"##O..#..G..D...##..#",
"#...##.#####..M....#",
"#.G....K....D..#...#",
"#.###..###.##..#G..#",
"#.....T....L.......#",
"#.O....D.....##....#",
"#.......G..........#",
"####################"
];
let map,player,gems,totalGems,keys,lives,score,gameState,enemyTick=0,moveLock=false;
const colors={wall:"#30394b",wallTop:"#46546a",dirt:"#765334",dirtLight:"#9b7048",floor:"#171d27",floorAlt:"#1b2431"};
function reset(){
 map=LEVEL.map(row=>row.split(""));
 player={x:1,y:1};gems=0;keys=0;lives=3;score=0;gameState="playing";enemyTick=0;moveLock=false;
 totalGems=map.flat().filter(c=>c==="G").length;
 // Make sure player starts on floor.
 map[player.y][player.x]=".";
 ui.message.textContent="Sammle alle Kristalle und finde den Ausgang.";
 updateHud();draw();
}
function updateHud(){ui.gems.textContent=`${gems} / ${totalGems}`;ui.lives.textContent=lives;ui.keys.textContent=keys;ui.score.textContent=score}
function setMessage(s){ui.message.textContent=s}
function inside(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS}
function tile(x,y){return inside(x,y)?map[y][x]:"#"}
function move(dx,dy){
 if(gameState!=="playing"||moveLock)return;
 const nx=player.x+dx,ny=player.y+dy,t=tile(nx,ny);
 if(t==="#")return;
 if(t==="D"){map[ny][nx]=".";player.x=nx;player.y=ny;score+=2;setMessage("Du hast dich durch die Erde gegraben.");}
 else if(t==="O"){
   const bx=nx+dx,by=ny+dy;
   if(dx===0||tile(bx,by)!==".")return;
   map[by][bx]="O";map[ny][nx]=".";player.x=nx;player.y=ny;
 }
 else if(t==="L"){
   if(keys<1){setMessage("Die Tür ist verschlossen. Suche einen Schlüssel!");return;}
   keys--;map[ny][nx]=".";player.x=nx;player.y=ny;setMessage("Die Steintür öffnet sich knarrend.");
 }
 else if(t==="G"){gems++;score+=100;map[ny][nx]=".";player.x=nx;player.y=ny;setMessage("Kristall eingesammelt!");}
 else if(t==="K"){keys++;score+=50;map[ny][nx]=".";player.x=nx;player.y=ny;setMessage("Schlüssel gefunden!");}
 else if(t==="T"){player.x=nx;player.y=ny;hurt("Eine Bodenfalle hat dich erwischt!");}
 else if(t==="M"){player.x=nx;player.y=ny;hurt("Der Tempelwächter hat dich erwischt!");}
 else if(t==="E"){
   if(gems<totalGems){setMessage(`Der Ausgang bleibt versiegelt. Es fehlen noch ${totalGems-gems} Kristalle.`);return;}
   player.x=nx;player.y=ny;gameState="won";score+=250;setMessage("Geschafft! Du hast den Tempel bezwungen. 🎉");
 }
 else {player.x=nx;player.y=ny;}
 updateHud();draw();
}
function hurt(reason){
 lives--;updateHud();
 if(lives<=0){gameState="lost";setMessage("Game Over – der Tempel hat dich besiegt. Drücke R zum Neustart.");return}
 // Reset position to start; collected treasure remains collected.
 player.x=1;player.y=1;setMessage(reason+" Du wurdest zum Eingang zurückgebracht.");
}
function tick(){
 if(gameState!=="playing")return;
 enemyTick++;
 if(enemyTick%2===0){
  const enemies=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(map[y][x]==="M")enemies.push({x,y});
  for(const e of enemies){
   const dx=Math.sign(player.x-e.x),dy=Math.sign(player.y-e.y);
   let nx=e.x,ny=e.y;
   if(Math.abs(player.x-e.x)>Math.abs(player.y-e.y))nx+=dx;else ny+=dy;
   if(tile(nx,ny)==="."){
    map[e.y][e.x]=".";map[ny][nx]="M";
   }else if(nx===player.x&&ny===player.y)hurt("Ein Wächter hat dich berührt!");
  }
 }
 // Gravity: rocks fall into empty floor, or crush the player.
 for(let y=ROWS-2;y>0;y--)for(let x=1;x<COLS-1;x++){
  if(map[y][x]==="O"&&map[y+1][x]==="."){
   if(player.x===x&&player.y===y+1){hurt("Ein herabfallender Felsbrocken hat dich getroffen!");}
   map[y+1][x]="O";map[y][x]=".";
  }
 }
 draw();
}
function roundedRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawTile(c,x,y){
 const px=x*TILE,py=y*TILE;
 ctx.fillStyle=((x+y)%2)?colors.floor:colors.floorAlt;ctx.fillRect(px,py,TILE,TILE);
 if(c==="#"){
  ctx.fillStyle=colors.wall;ctx.fillRect(px,py,TILE,TILE);
  ctx.fillStyle=colors.wallTop;ctx.fillRect(px+2,py+2,TILE-4,5);
  ctx.fillStyle="#222a39";ctx.fillRect(px+3,py+TILE-6,TILE-6,3);
  ctx.fillStyle="#56647a";ctx.fillRect(px+5,py+12,4,3);ctx.fillRect(px+21,py+22,5,3);
 }else if(c==="D"){
  ctx.fillStyle=colors.dirt;ctx.fillRect(px+2,py+2,28,28);
  ctx.fillStyle=colors.dirtLight;ctx.fillRect(px+6,py+7,7,4);ctx.fillRect(px+19,py+19,6,4);
  ctx.fillStyle="#4d3527";ctx.fillRect(px+15,py+12,4,4);
 }else if(c==="O"){
  roundedRect(px+3,py+3,26,26,7,"#6f7884");roundedRect(px+6,py+5,20,8,4,"#aab3bc");
  ctx.fillStyle="#4b5562";ctx.fillRect(px+8,py+20,14,4);ctx.fillRect(px+21,py+13,4,5);
 }else if(c==="G"){
  ctx.fillStyle="#55f0ff";ctx.beginPath();ctx.moveTo(px+16,py+3);ctx.lineTo(px+27,py+15);ctx.lineTo(px+16,py+29);ctx.lineTo(px+5,py+15);ctx.closePath();ctx.fill();
  ctx.fillStyle="#d9ffff";ctx.beginPath();ctx.moveTo(px+16,py+5);ctx.lineTo(px+20,py+15);ctx.lineTo(px+16,py+23);ctx.lineTo(px+12,py+15);ctx.closePath();ctx.fill();
 }else if(c==="K"){
  ctx.strokeStyle="#ffd65b";ctx.lineWidth=4;ctx.beginPath();ctx.arc(px+12,py+12,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#ffd65b";ctx.fillRect(px+16,py+11,11,4);ctx.fillRect(px+22,py+14,3,5);
 }else if(c==="E"){
  ctx.fillStyle="#4c3826";ctx.fillRect(px+5,py+2,22,30);ctx.fillStyle="#d5a34b";ctx.fillRect(px+8,py+5,16,27);ctx.fillStyle="#392a21";ctx.fillRect(px+11,py+8,10,24);ctx.fillStyle="#f6d36c";ctx.fillRect(px+18,py+18,2,3);
 }else if(c==="L"){
  ctx.fillStyle="#7e4934";ctx.fillRect(px+3,py+2,26,30);ctx.fillStyle="#c18a50";ctx.fillRect(px+7,py+5,18,25);ctx.fillStyle="#553624";ctx.fillRect(px+10,py+9,12,21);ctx.fillStyle="#e9c16d";ctx.fillRect(px+20,py+18,3,3);
 }else if(c==="T"){
  ctx.fillStyle="#394454";for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(px+2+i*8,py+28);ctx.lineTo(px+6+i*8,py+7);ctx.lineTo(px+10+i*8,py+28);ctx.fill()}
 }else if(c==="M"){
  roundedRect(px+5,py+5,22,23,7,"#a54b43");ctx.fillStyle="#ffdb8b";ctx.fillRect(px+9,py+12,4,4);ctx.fillRect(px+20,py+12,4,4);ctx.fillStyle="#241b20";ctx.fillRect(px+10,py+13,2,2);ctx.fillRect(px+21,py+13,2,2);ctx.fillStyle="#552c34";ctx.fillRect(px+11,py+21,10,3);
 }
}
function drawPlayer(){
 const x=player.x*TILE,y=player.y*TILE;
 // Original explorer sprite, drawn from simple shapes.
 ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(x+16,y+27,10,4,0,0,Math.PI*2);ctx.fill();
 roundedRect(x+7,y+12,18,15,5,"#3c9b77");
 roundedRect(x+8,y+2,16,14,5,"#e6b98a");
 ctx.fillStyle="#293447";ctx.fillRect(x+8,y+1,16,5);ctx.fillRect(x+7,y+5,4,4);ctx.fillRect(x+21,y+5,4,4);
 ctx.fillStyle="#26303e";ctx.fillRect(x+12,y+8,2,2);ctx.fillRect(x+20,y+8,2,2);
 ctx.fillStyle="#e6b98a";ctx.fillRect(x+3,y+17,5,7);ctx.fillRect(x+24,y+17,5,7);
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawTile(map[y][x],x,y);
 drawPlayer();
 if(gameState==="won"||gameState==="lost"){
  ctx.fillStyle="#080b11cc";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign="center";ctx.fillStyle=gameState==="won"?"#f3d27b":"#ff8d82";
  ctx.font="bold 34px system-ui";ctx.fillText(gameState==="won"?"TEMPEL GESCHAFFT!":"GAME OVER",canvas.width/2,canvas.height/2-8);
  ctx.fillStyle="#fff";ctx.font="18px system-ui";ctx.fillText("Drücke R für einen neuen Versuch",canvas.width/2,canvas.height/2+28);
 }
}
const keyMap={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
document.addEventListener("keydown",e=>{
 if(e.key.toLowerCase()==="r"){reset();return}
 const dir=keyMap[e.key];if(dir){e.preventDefault();move(...dir)}
});
document.querySelectorAll("[data-dir]").forEach(btn=>btn.addEventListener("click",()=>{
 const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};move(...dirs[btn.dataset.dir]);
}));
document.getElementById("restart").addEventListener("click",reset);
setInterval(tick,550);
reset();
})();
</script>
</body>
</html>
